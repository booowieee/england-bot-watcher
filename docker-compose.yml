services:
  england-bot-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: england_bot_watcher
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    shm_size: '512mb'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
